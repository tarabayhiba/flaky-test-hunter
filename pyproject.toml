[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flake-hunter"
version = "0.1.0"
description = "Run a pytest suite N times, find tests that pass sometimes and fail sometimes, and report/quarantine them."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pytest>=8.0",
    "pytest-json-report>=1.5",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "pytest-cov>=5.0",
]

[project.scripts]
flake-hunter = "flake_hunter.cli:main"

[tool.setuptools.packages.find]
include = ["flake_hunter*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "C4", "N", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["flake_hunter"]

[[tool.mypy.overrides]]
module = ["pytest_jsonreport.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
